# Postgres chạy thật cho Track A (không phải container tạm dùng để test).
# Dùng pgvector/pgvector:pg17 để khớp đúng image đã ghi trong docs/plan.md §2.1 — dù
# Track A chưa cần pgvector, Track B sau này cần cho embedding (docs/plan.md §5.3).
#
# Đây là môi trường dev cục bộ, chạy trên máy đang code — không phải Postgres 5433 dùng
# chung với blog/sản phẩm (nếu có) trên Mac Mini. Khi chuyển lên Mac Mini thật, chỉ cần
# đổi POSTGRES_HOST trong .env, dữ liệu/schema/migration không đổi gì.
#
# Chạy: docker compose up -d   (từ thư mục này, cần file .env cùng cấp — xem .env.example)

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: registry-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - registry_pgdata:/var/lib/postgresql/data

  # n8n DEV — ĐÃ NGƯNG DÙNG (2026-08-13). A5 ban đầu build bằng n8n (xem
  # A5-n8n-workflow.md), sau đó đổi hướng sang webapp riêng (track-a/webapp/) để có UI
  # settings/trigger/progress mà không phải học n8n. Container n8n-dev đã stop, volume
  # còn giữ lại (chưa xoá) đề phòng cần xem lại workflow cũ. Bỏ comment block dưới nếu
  # cần chạy lại n8n để tham khảo.
  # n8n:
  #   image: docker.n8n.io/n8nio/n8n:latest
  #   container_name: n8n-dev
  #   restart: "no"
  #   ports:
  #     - "5678:5678"
  #   environment:
  #     - N8N_SECURE_COOKIE=false
  #   volumes:
  #     - n8n_dev_data:/home/node/.n8n
  #   depends_on:
  #     - postgres

volumes:
  registry_pgdata:
  n8n_dev_data:
