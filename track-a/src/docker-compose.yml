# Postgres chạy thật cho Track A (không phải container tạm dùng để test).
# Dùng pgvector/pgvector:pg17 để khớp đúng image đã ghi trong docs/plan.md §2.1 — dù
# Track A chưa cần pgvector, Track B sau này cần cho embedding (docs/plan.md §5.3).
#
# Đây là môi trường dev cục bộ, chạy trên máy đang code — không phải Postgres 5433 dùng
# chung với blog/sản phẩm (nếu có) trên Mac Mini. Khi chuyển lên Mac Mini thật, chỉ cần
# đổi POSTGRES_HOST trong .env, dữ liệu/schema/migration không đổi gì.
#
# Chạy: docker compose up -d   (từ thư mục này, cần file .env cùng cấp — xem .env.example)

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: registry-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - registry_pgdata:/var/lib/postgresql/data

  # n8n DEV — chỉ để thiết kế + test workflow A5, xuất JSON để import vào n8n thật trên
  # máy host sau. KHÔNG phải n8n production (không có Zalo credential thật, không chạy
  # crawler thật qua Docker-in-Docker ở đây — xem A5-n8n-workflow.md phần giới hạn).
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n-dev
    restart: "no"
    ports:
      - "5678:5678"
    environment:
      - N8N_SECURE_COOKIE=false
    volumes:
      - n8n_dev_data:/home/node/.n8n
    depends_on:
      - postgres

volumes:
  registry_pgdata:
  n8n_dev_data:
