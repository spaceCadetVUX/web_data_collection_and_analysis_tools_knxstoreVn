<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Track A — Registry Diff</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --border: #e3e5e9;
      --text: #1f2430;
      --text-muted: #6b7280;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --ok: #059669; --ok-bg: #ecfdf5;
      --failed: #dc2626; --failed-bg: #fef2f2;
      --skipped: #d97706; --skipped-bg: #fffbeb;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
      max-width: 960px; margin: 0 auto; padding: 1.5rem 1.25rem 3rem;
      background: var(--bg); color: var(--text); line-height: 1.5;
    }
    nav {
      display: flex; gap: 0.25rem; margin-bottom: 1.5rem;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; padding: 0.4rem; width: fit-content;
    }
    nav a {
      color: var(--text-muted); text-decoration: none; font-weight: 500;
      padding: 0.5rem 1rem; border-radius: 7px; font-size: 0.92rem;
    }
    nav a:hover { background: var(--bg); color: var(--text); }
    h1 { font-size: 1.5rem; margin: 0 0 1.25rem; }
    h2 { font-size: 1.05rem; margin: 2rem 0 0.75rem; color: var(--text); }
    h3 { font-size: 0.95rem; margin: 1.5rem 0 0.5rem; color: var(--text-muted); }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 1.25rem 1.5rem; margin-bottom: 1rem;
    }
    table { width: 100%; border-collapse: collapse; }
    th {
      text-align: left; padding: 0.5rem 0.7rem; font-size: 0.78rem;
      text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-muted);
      border-bottom: 1px solid var(--border);
    }
    td {
      padding: 0.65rem 0.7rem; font-size: 0.9rem; border-bottom: 1px solid var(--border);
    }
    tr:last-child td { border-bottom: none; }
    .badge {
      display: inline-block; padding: 0.15rem 0.6rem; border-radius: 999px;
      font-size: 0.78rem; font-weight: 600;
    }
    .badge.ok, .badge.active { color: var(--ok); background: var(--ok-bg); }
    .badge.failed, .badge.aborted_anomaly, .badge.error { color: var(--failed); background: var(--failed-bg); }
    .badge.skipped_no_credential { color: var(--skipped); background: var(--skipped-bg); }
    button {
      background: var(--accent); color: #fff; border: none;
      padding: 0.65rem 1.3rem; border-radius: 8px; cursor: pointer;
      font-size: 0.92rem; font-weight: 600;
    }
    button:hover { background: var(--accent-hover); }
    button:disabled { background: #cbd2db; cursor: not-allowed; }
    button.secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
    button.secondary:hover { background: var(--bg); }
    input, select {
      background: #fff; color: var(--text); border: 1px solid var(--border);
      padding: 0.5rem 0.7rem; border-radius: 8px; font-size: 0.9rem;
    }
    input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    .muted { color: var(--text-muted); font-size: 0.85rem; }
    .row { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
  </style>
</head>
<body>
  <nav>
    <a href="/">Dashboard</a>
    <a href="/settings">Settings</a>
    <a href="/logs">Logs</a>
  </nav>
  {% block content %}{% endblock %}
</body>
</html>
